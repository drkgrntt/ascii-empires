# `name:` pins the Compose project name. Without it, Compose defaults to the
# directory's basename ("server") - which would collide with any other
# checkout on this host that also has a server/ directory (e.g.
# ~/sites/store/server). Compose tracks container identity by project+service
# label, not container_name, so that collision makes `docker compose up`
# recreate the OTHER project's live container instead of creating a new one.
# (This actually happened to client/docker-compose.yml's identical "client"
# collision with store/client - see its comment.)
name: ascii-empires-server
services:
  web:
    build: .
    container_name: ascii-empires-server
    restart: unless-stopped
    # Postgres stays native on the host (see DEPLOY.md), so the container
    # shares the host's network namespace instead of a bridge network,
    # same pattern as the rest of the fleet (store/go-server,
    # derekgarnett.com). This keeps DB_HOST=localhost in .env working
    # unchanged and lets nginx proxy_pass to 127.0.0.1:$PORT.
    #
    # For local dev, use docker-compose.dev.yml instead (a containerized
    # Postgres, not this service) - this file is prod-only.
    network_mode: host
    env_file:
      - .env
