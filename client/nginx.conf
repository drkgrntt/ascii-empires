# Static SPA serving, run inside the container (see Dockerfile).
# Port 6100 is fixed: nginx.conf is baked into the image, and the host's
# nginx (see DEPLOY.md) proxy_passes to this exact port.
server {
    listen 6100;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing fallback - unknown paths resolve to index.html
    # rather than a static 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
